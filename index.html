<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio of Suika">
  <title>Portfolio of Suika</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="banner-wrap" aria-label="Portfolio banner">
    <img class="banner-img" src="banner.png" alt="Portfolio of Suika banner">
  </header>

  <main class="content-shell">
    <section class="intro-wrap">
      <div class="intro-text" aria-label="Introduction">
        <p>Hello! I am Mekhi Hill, better known as Suika! online.</p>
        <p>
          This is my portfolio of Music, Animations, and Art for future reference
          (ie. School and Work). I also just wanna share a fair bit of my work to
          hopefully inspire other up and coming artists!
        </p>
      </div>
      <div class="divider" aria-hidden="true"></div>
    </section>

    <section class="work-section" aria-label="My work categories">
      <h2 class="work-title">My Work</h2>
      <div class="work-divider" aria-hidden="true"></div>

      <div class="work-grid">
        <button class="work-card art-card" type="button" aria-label="View art work">
          <svg class="work-icon art-icon" viewBox="0 0 320 220" aria-hidden="true">
            <path d="M72 64c0-20 16-36 36-36h44c20 0 36 16 36 36v12c0 18-7 35-20 47L126 146c-3 3-7 5-11 5h-2c-4 0-8-2-11-5L92 123c-13-12-20-29-20-47V64Z" fill="#d8b17a" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
            <circle cx="106" cy="66" r="24" fill="#22b14c" stroke="#1a1a1a" stroke-width="7"/>
            <circle cx="170" cy="66" r="24" fill="#1d5cff" stroke="#1a1a1a" stroke-width="7"/>
            <circle cx="234" cy="66" r="24" fill="#ff2d2d" stroke="#1a1a1a" stroke-width="7"/>
            <circle cx="138" cy="128" r="24" fill="#f7ee32" stroke="#1a1a1a" stroke-width="7"/>
            <circle cx="202" cy="128" r="24" fill="#69f6ff" stroke="#1a1a1a" stroke-width="7"/>
            <path d="M54 160c12-12 20-18 36-18h84c16 0 24 6 36 18l14 14c9 9 8 24-2 33l-11 11c-10 10-25 10-35 0l-16-15c-9-8-20-12-32-12h-18c-12 0-23 4-32 12l-16 15c-10 10-25 10-35 0l-11-11c-10-9-11-24-2-33l14-14Z" fill="#d8b17a" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
            <path d="M268 90h22c10 0 18 8 18 18v14c0 10-8 18-18 18h-22" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
          </svg>
          <span>Art</span>
        </button>

        <button class="work-card music-card" type="button" aria-label="Listen to music">
          <svg class="work-icon music-icon" viewBox="0 0 320 220" aria-hidden="true">
            <path d="M196 46v84c0 15-12 28-28 28h-7c-17 0-30-13-30-28V76c0-15 13-28 30-28h7c17 0 28 13 28 28v54" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M134 84c0-32 26-58 58-58s58 26 58 58v66c0 32-26 58-58 58s-58-26-58-58V84Z" fill="#1d90ff" stroke="#1a1a1a" stroke-width="7"/>
            <path d="M180 50c-6 0-11 5-11 11v36c0 6 5 11 11 11s11-5 11-11V61c0-6-5-11-11-11Z" fill="#c4edff"/>
            <circle cx="192" cy="142" r="10" fill="#ff1f1f"/>
            <path d="M112 118c-12 0-21 10-21 22v15c0 12 9 22 21 22h12v-59h-12Z" fill="#7ec8ff" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
            <path d="M248 118c12 0 21 10 21 22v15c0 12-9 22-21 22h-12v-59h12Z" fill="#7ec8ff" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="round"/>
            <path d="M152 196v18m72-18v18" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
          </svg>
          <span>Music</span>
        </button>

        <button class="work-card animation-card" type="button" aria-label="View animation work">
          <svg class="work-icon animation-icon" viewBox="0 0 420 220" aria-hidden="true">
            <rect x="80" y="36" width="260" height="144" rx="18" fill="#1d2d8f" stroke="#1a1a1a" stroke-width="8"/>
            <path d="M112 88c18-14 30-22 48-22 18 0 30 8 48 22l-48 34-48-34Z" fill="#ffffff" opacity="0.9"/>
            <path d="M202 78h52c20 0 36 16 36 36v16c0 20-16 36-36 36h-52c-20 0-36-16-36-36V114c0-20 16-36 36-36Z" fill="#f7f7f7" opacity="0.95"/>
            <path d="M185 96v64l52-32-52-32Z" fill="#1d2d8f"/>
            <path d="M128 116c0-6 5-11 11-11h36c6 0 11 5 11 11v10c0 6-5 11-11 11h-36c-6 0-11-5-11-11v-10Z" fill="#f6f6f6" opacity="0.9"/>
            <path d="M284 82c36 0 65 29 65 65 0 36-29 65-65 65-36 0-65-29-65-65 0-36 29-65 65-65Zm0 28c-20 0-37 16-37 37s17 37 37 37 37-16 37-37-17-37-37-37Z" fill="#ffffff" opacity="0.8"/>
            <path d="M264 116c9-15 27-25 46-25 9 0 18 2 26 7l-29 30-43-12Z" fill="#1d2d8f" opacity="0.8"/>
          </svg>
          <span>Animation</span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
