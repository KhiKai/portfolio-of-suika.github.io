<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Header</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero-banner">
    <!-- Background Layer: Angled Stripe Patterns -->
    <div class="stripe-bg"></div>

    <!-- Background Layer: Decorative Accent Shapes -->
    <div class="accent-star star-1">★</div>
    <div class="accent-star star-2">✦</div>

    <!-- Main Content Container -->
    <div class="banner-content">
      <h1 class="banner-title" data-text="HEADER TITLE">HEADER TITLE</h1>
      <p class="banner-subtitle">SUBTITLE OR TAGLINE GOES HERE</p>
    </div>
  </header>

</body>
</html>
